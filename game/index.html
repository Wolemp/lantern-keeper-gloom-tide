<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lantern Keeper: Gloom Tide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030d; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Lantern Keeper: move with WASD, aim and shoot with the mouse, dash with Space, and keep the lantern lit against waves of gloom"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
